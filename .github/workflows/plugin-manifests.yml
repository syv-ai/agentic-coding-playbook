name: Plugin manifests

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - "gemini-extension.json"
      - "scripts/sync-manifests.mjs"
      - ".github/workflows/plugin-manifests.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - "gemini-extension.json"
      - "scripts/sync-manifests.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Generated manifests are current
        run: node scripts/sync-manifests.mjs --check
      # Claude Code and Codex only refresh an installed plugin when its version
      # changes, so a skill change without a bump never reaches existing users.
      - name: Skill changes bump the version
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- skills; then exit 0; fi
          old=$(git show "$base:.claude-plugin/plugin.json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')
          new=$(node -pe 'require("./.claude-plugin/plugin.json").version')
          if [ "$old" = "$new" ]; then
            echo "::error::skills/ changed but the version is still $new. Run: node scripts/sync-manifests.mjs --bump <next>"
            exit 1
          fi
