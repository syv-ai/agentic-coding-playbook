name: Plugin manifests

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - "gemini-extension.json"
      - "scripts/sync-manifests.mjs"
      - ".github/workflows/plugin-manifests.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - "gemini-extension.json"
      - "scripts/sync-manifests.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Generated manifests are current
        run: node scripts/sync-manifests.mjs --check
      # Claude Code and Codex only refresh an installed plugin when its version
      # changes, and a lower version can leave existing installs behind, so a
      # skill change must raise the version.
      - name: Skill changes raise the version
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- skills; then exit 0; fi
          old=$(git show "$base:.claude-plugin/plugin.json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version || "0.0.0"')
          new=$(node -pe 'require("./.claude-plugin/plugin.json").version')
          if ! node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a.map((n, i) => n - b[i]).find((d) => d !== 0) ?? 0;
            process.exit(cmp > 0 ? 0 : 1);
          ' "$new" "$old"; then
            echo "::error::skills/ changed, so the version must be higher than $old (it is $new). Run: node scripts/sync-manifests.mjs --bump <next>"
            exit 1
          fi
